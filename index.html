    <script>
      // Compatibility shim: ensures window.fetch has both getter and setter
      // preventing browser extensions from throwing TypeError: Cannot set property fetch of #<Window> which has only a getter
      (function() {
        try {
          var origFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : null;
          var activeFetch = origFetch;
          var desc = {
            get: function() {
              return activeFetch;
            },
            set: function(fn) {
              activeFetch = fn;
            },
            configurable: true,
            enumerable: true
          };
          try {
            Object.defineProperty(window, 'fetch', desc);
          } catch (e1) {
            if (typeof Window !== 'undefined' && Window.prototype) {
              try {
                Object.defineProperty(Window.prototype, 'fetch', desc);
              } catch (e2) {}
            }
          }
        } catch (e) {}
      })();
    </script>
